<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schüler App</title>
    <!-- STYLE / CSS -->
    <link rel="stylesheet" href="./src/style/helpers/reset.css" />
    <link rel="stylesheet" href="./src/style/main.css" />
    <link rel="stylesheet" href="./src/style/home.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__navbar">
        <div class="header__logo">
          <a href="/" class="header__logo-link">Schüler App</a>
        </div>

        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="nav__list-item">
              <a href="/faecher" class="nav__list-link">Fächer</a>
            </li>
            <li class="nav__list-item">
              <a href="/stundenplan" class="nav__list-link">Stundenplan</a>
            </li>
          </ul>

          <ul class="header__user-nav" id="guest_nav">
            <li class="user-nav__item">
              <button class="user-nav__button" id="login_btn">Anmelden</button>
            </li>
            <li class="user-nav__item">
              <button class="user-nav__button" id="register_btn">
                Registrieren
              </button>
            </li>
          </ul>

          <ul class="header__user-nav" id="user_nav" hidden>
            <li class="user-nav__item">
              <a href="/profil" class="user-nav__link" id="profile_link"
                >Profil</a
              >
            </li>
            <li class="user-nav__item">
              <button class="user-nav__button" id="logout_btn">Abmelden</button>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main"></main>

    <footer class="footer home-footer">
      <div class="footer__inner">
        <p class="footer__copyright">
          &copy; 2026 Schüler App. Alle Rechte vorbehalten.
        </p>

        <ul class="footer__nav-list">
          <li class="footer__nav-item">
            <a href="/impressum" class="footer__nav-link">Impressum</a>
          </li>
          <li class="footer__nav-item">
            <a href="/datenschutz" class="footer__nav-link">Datenschutz</a>
          </li>
          <li class="footer__nav-item">
            <a href="/kontakt" class="footer__nav-link">Kontakt</a>
          </li>
        </ul>
      </div>
    </footer>

    <!-- Script -->
    <script src="src/js/script.js"></script>
  </body>
</html>
